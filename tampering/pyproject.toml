[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-tampering"
version = "0.2.0"
description = "Document tampering detection POC using DocTamper — standalone phase of the eKYC fraud pipeline"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "scipy>=1.11",
]

[project.optional-dependencies]
doctamper = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "segmentation_models_pytorch>=0.3",
    "efficientnet_pytorch>=0.7",
]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["detector*"]

# Vendored DocTamper code (detector/models/) is research code from upstream
# and triggers many style warnings that are not bugs. Silence linters and
# type checkers there; project code outside that path stays under analysis.

[tool.ruff]
extend-exclude = ["detector/models"]

[tool.pyright]
exclude = ["detector/models", "**/__pycache__", "weights"]
reportMissingImports = "warning"

[tool.mypy]
exclude = "detector/models"
ignore_missing_imports = true
