# Single source of truth for all tunable parameters.
# Override at runtime via CLI flag or env var DOCPIPE_CONFIG=<path>.

[io]
pdf_render_dpi = 300

[preprocessing]
min_dimension = 800
max_deskew_angle = 5.0
min_deskew_angle = 0.3
border_px = 5

[preprocessing.enhance]
clahe_clip_limit = 2.0
clahe_tile_grid = [8, 8]
unsharp_sigma = 1.5
unsharp_amount = 1.6
unsharp_base = -0.6

[quality]
# Metrics saturate to 1.0 at these targets.
target_text_sharpness = 25.0
target_text_contrast = 55.0
target_x_height_px = 22.0
# Composite weights (must sum to 1.0).
weight_sharpness = 0.5
weight_contrast = 0.2
weight_x_height = 0.3
# Pass threshold on composite score.
threshold = 0.45
# Minimum text-like components below which we assume no document.
min_text_components = 8
# Adaptive threshold tuning.
adaptive_block_size = 31
adaptive_c = 10

[ocr]
languages = ["en", "hi"]
use_gpu = false
# EasyOCR confidence: detections below this go to 'low_confidence' bucket.
confidence_threshold = 0.20
# Script classification: fraction of Latin-range chars for 'english'.
latin_threshold = 0.50
# Max normalized vertical distance for two words to belong to the same line.
line_threshold = 0.02

[visualization]
font_path = "assets/fonts/NotoSansDevanagari.ttf"

[pipeline]
workers = 4
