[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-ocr"
version = "0.1.0"
description = "Bilingual (EN/HI) document preprocessing + OCR pipeline for personal-document validation"
requires-python = ">=3.10"
dependencies = [
    "easyocr>=1.7",
    "opencv-python>=4.8",
    "PyMuPDF>=1.24",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tomli>=2.0; python_version<'3.11'",
]

[project.scripts]
docpipe = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
